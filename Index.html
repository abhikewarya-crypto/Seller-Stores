<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meri Dukaan</title>
<style>
:root{--bg:#fffaf5;--card:#fff;--ink:#2a1a22;--mute:#7a6870;--line:#efdfd6;--acc:#b0124f;--acc2:#fde4ee;--ok:#1b7f4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1216;--card:#261a20;--ink:#f6e9ee;--mute:#b79ca7;--line:#3a2a32;--acc:#ff6fa3;--acc2:#3a1f2c;--ok:#5fd394;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1216;--card:#261a20;--ink:#f6e9ee;--mute:#b79ca7;--line:#3a2a32;--acc:#ff6fa3;--acc2:#3a1f2c;--ok:#5fd394;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hind","Noto Sans Devanagari",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
h1{margin:0;font-size:22px;font-weight:800;color:var(--acc)}
.cartbtn{border:0;background:var(--acc);color:#fff;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.sub{padding:14px 16px 4px;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 16px 90px;max-width:960px;margin:auto}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.pic{aspect-ratio:1;display:grid;place-items:center;font-size:56px}
.pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pn{font-size:14px;line-height:1.3}
.pr{font-weight:800;font-size:18px}
.pr s{font-weight:400;font-size:13px;color:var(--mute);margin-left:6px}
.add{margin-top:auto;border:1.5px solid var(--acc);background:var(--acc2);color:var(--acc);border-radius:10px;padding:8px;font:inherit;font-weight:700;cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10}
.ov.on{display:block}
.sheet{position:absolute;bottom:0;left:0;right:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:560px;margin:auto}
.sheet h2{margin:0 0 10px;font-size:19px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.row .n{flex:1;font-size:14px}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;cursor:pointer}
.q span{display:inline-block;min-width:22px;text-align:center}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px;padding:12px 0}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.go{width:100%;margin-top:14px;border:0;background:var(--ok);color:#fff;border-radius:12px;padding:14px;font:inherit;font-weight:800;font-size:17px;cursor:pointer}
.link{background:none;border:0;color:var(--mute);font:inherit;margin-top:10px;cursor:pointer;text-decoration:underline}
.err{color:#d6336c;font-size:13px;min-height:18px;margin-top:8px}
.note{font-size:13px;color:var(--mute);margin-top:8px}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header><h1 id="shop"></h1><button class="cartbtn" id="open">Cart (<span id="cnt">0</span>)</button></header>
<div class="sub">Cash on Delivery · poore India me delivery</div>
<main class="grid" id="grid"></main>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script>
/* ====== YAHAN APNI DETAILS BADLO ====== */
var SHOP_NAME = "Meri Dukaan";
var WHATSAPP = "919456912022"; /* apna number: 91 + 10 digit, bina + ya space ke */
var PRODUCTS = [
 {id:1,name:"Cotton Kurti (Blue)",price:399,mrp:799,icon:"👗",bg:"#dbe8ff"},
 {id:2,name:"Handmade Jhumka Set",price:149,mrp:299,icon:"💎",bg:"#ffe3cf"},
 {id:3,name:"Steel Water Bottle 1L",price:249,mrp:449,icon:"🍶",bg:"#d9f3e4"},
 {id:4,name:"Men's Casual Shirt",price:449,mrp:899,icon:"👕",bg:"#f0e0ff"},
 {id:5,name:"Kitchen Storage Jar Set",price:299,mrp:599,icon:"🫙",bg:"#fff2c2"},
 {id:6,name:"Kids Backpack",price:349,mrp:699,icon:"🎒",bg:"#ffd9e4"}
];
/* ===================================== */
var cart = {};
try{ cart = JSON.parse(localStorage.getItem("cart")||"{}") }catch(e){}
function save(){ try{localStorage.setItem("cart",JSON.stringify(cart))}catch(e){} }
function $(i){return document.getElementById(i)}
function rs(n){return "₹"+n.toLocaleString("en-IN")}
function find(id){return PRODUCTS.filter(function(p){return p.id==id})[0]}
function count(){return Object.keys(cart).reduce(function(a,k){return a+cart[k]},0)}
function total(){return Object.keys(cart).reduce(function(a,k){return a+cart[k]*find(k).price},0)}
document.title = SHOP_NAME; $("shop").textContent = SHOP_NAME;

$("grid").innerHTML = PRODUCTS.map(function(p){
 return '<div class="p"><div class="pic" style="background:'+p.bg+'">'+p.icon+'</div><div class="pb"><div class="pn">'+p.name+'</div><div class="pr">'+rs(p.price)+'<s>'+rs(p.mrp)+'</s></div><button class="add" data-id="'+p.id+'">Cart me daalo</button></div></div>';
}).join("");
$("grid").onclick = function(e){
 var id = e.target.getAttribute("data-id"); if(!id) return;
 cart[id] = (cart[id]||0)+1; save(); refresh(); e.target.textContent = "Add ho gaya ✓";
 setTimeout(function(){e.target.textContent="Cart me daalo"},900);
};
function refresh(){ $("cnt").textContent = count() }
function show(html){ $("sheet").innerHTML = html; $("ov").classList.add("on") }
function hide(){ $("ov").classList.remove("on") }
$("ov").onclick = function(e){ if(e.target===$("ov")) hide() };
$("open").onclick = viewCart;

function viewCart(){
 var ids = Object.keys(cart);
 if(!ids.length){ show('<h2>Cart khali hai</h2><p class="note">Koi product add karo, phir yahan aao.</p><button class="link" onclick="hide()">Band karo</button>'); return }
 var rows = ids.map(function(k){var p=find(k);
  return '<div class="row"><div class="n">'+p.icon+' '+p.name+'<br><b>'+rs(p.price)+'</b></div><div class="q"><button onclick="chg('+k+',-1)">−</button><span>'+cart[k]+'</span><button onclick="chg('+k+',1)">+</button></div></div>'}).join("");
 show('<h2>Aapka Cart</h2>'+rows+'<div class="tot"><span>Total</span><span>'+rs(total())+'</span></div><button class="go" onclick="checkout()">Order karne ke liye aage badho</button><button class="link" onclick="hide()">Aur shopping karo</button>');
}
function chg(k,d){ cart[k]=(cart[k]||0)+d; if(cart[k]<=0) delete cart[k]; save(); refresh(); viewCart() }

function checkout(){
 show('<h2>Delivery details</h2>'+
 '<label>Poora naam</label><input id="f_name" autocomplete="name">'+
 '<label>Mobile number</label><input id="f_ph" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel">'+
 '<label>Poora address (ghar no., gali, area)</label><textarea id="f_ad" rows="3" autocomplete="street-address"></textarea>'+
 '<div class="two"><div><label>Shehar</label><input id="f_ct"></div><div><label>Pincode</label><input id="f_pin" inputmode="numeric" maxlength="6"></div></div>'+
 '<label>State</label><input id="f_st">'+
 '<div class="tot"><span>Total (COD)</span><span>'+rs(total())+'</span></div>'+
 '<div class="err" id="err"></div>'+
 '<button class="go" onclick="place()">Order confirm karo</button>'+
 '<div class="note">Order seller ko WhatsApp par jayega. Payment delivery par.</div>'+
 '<button class="link" onclick="viewCart()">Wapas cart me</button>');
}
function place(){
 var v=function(i){return $(i).value.trim()};
 var name=v("f_name"),ph=v("f_ph"),ad=v("f_ad"),ct=v("f_ct"),pin=v("f_pin"),st=v("f_st");
 if(name.length<2) return $("err").textContent="Naam likho.";
 if(!/^[6-9]\d{9}$/.test(ph)) return $("err").textContent="10 digit ka sahi mobile number likho.";
 if(ad.length<10) return $("err").textContent="Poora address likho.";
 if(!ct||!st) return $("err").textContent="Shehar aur state likho.";
 if(!/^\d{6}$/.test(pin)) return $("err").textContent="6 digit ka pincode likho.";
 var lines = Object.keys(cart).map(function(k){var p=find(k);return "• "+p.name+" x "+cart[k]+" = "+rs(p.price*cart[k])}).join("\n");
 var msg = "*Naya Order*\n"+lines+"\n\n*Total: "+rs(total())+"* (COD)\n\n*Naam:* "+name+"\n*Mobile:* "+ph+"\n*Address:* "+ad+", "+ct+", "+st+" - "+pin;
 var url = "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg);
 cart = {}; save(); refresh();
 show('<h2>Order tayyar ✓</h2><p>Neeche button dabao, WhatsApp khulega aur order seller ko chala jayega.</p><a href="'+url+'" target="_blank" rel="noopener"><button class="go">WhatsApp par order bhejo</button></a><button class="link" onclick="hide()">Band karo</button>');
}
refresh();
</script>
</body>
</html>
